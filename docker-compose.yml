services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cms_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    networks:
      - cms_network
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: cms_nginx
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - cms_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: cms_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cms_headless
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: secret
      MYSQL_USER: cms_user
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - cms_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: cms_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    networks:
      - cms_network
    depends_on:
      - db

  redis:
    image: redis:alpine
    container_name: cms_redis
    restart: unless-stopped
    networks:
      - cms_network

  npm:
    image: node:20-alpine
    container_name: cms_npm
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    entrypoint: ['npm']
    networks:
      - cms_network

volumes:
  db_data:

networks:
  cms_network:
    driver: bridge
